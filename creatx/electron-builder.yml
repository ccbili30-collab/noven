appId: com.creatx.desktop
productName: 诺文
copyright: Copyright © 2026 诺文

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "node_modules/**/*.node"

# yt-dlp.exe and ffmpeg.exe must stay outside app.asar — an executable inside the archive
# cannot be spawned. This lands them at resources/vendor/win-x64, which is the first candidate
# resolveVideoBinaries checks (process.resourcesPath).
extraResources:
  - from: apps/desktop/vendor/win-x64
    to: vendor/win-x64
    filter:
      - "**/*.exe"
      - "VENDOR.json"
      # Redistributing an LGPL ffmpeg build obliges us to ship its license text alongside it.
      - "LICENSE.ffmpeg.txt"
      - "LICENSE*"
      - "*.txt"

npmRebuild: false

win:
  executableName: 诺文
  icon: apps/desktop/build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "${productName}-${version}-${arch}-Setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 诺文
  uninstallDisplayName: 诺文

portable:
  artifactName: "${productName}-${version}-${arch}-Portable.${ext}"
