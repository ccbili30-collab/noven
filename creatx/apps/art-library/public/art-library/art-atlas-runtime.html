<script>
if (false) {
const orbitStage = document.getElementById("orbitStage");
const orbitPieces = [...document.querySelectorAll("[data-orbit-piece]")];
const orbitCurrent = document.getElementById("orbitCurrent");
const orbitHudLine = document.getElementById("orbitHudLine");
const orbitCount = orbitPieces.length;
const orbitStep = orbitCount ? (Math.PI * 2) / orbitCount : 0;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let currentAngle = orbitCount ? -2 * orbitStep : 0;
let targetAngle = currentAngle;
let snapTimer = 0;
let dragging = false;
let pointerStartY = 0;
let pointerStartAngle = 0;

function normalizeAngle(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function nearestIndex(angle) {
  if (!orbitCount) return 0;
  return ((Math.round(-angle / orbitStep) % orbitCount) + orbitCount) % orbitCount;
}

function snapOrbit() {
  if (!orbitCount) return;
  targetAngle = Math.round(targetAngle / orbitStep) * orbitStep;
}

function scheduleSnap() {
  window.clearTimeout(snapTimer);
  snapTimer = window.setTimeout(snapOrbit, 150);
}

function renderOrbit() {
  if (!orbitStage || !orbitCount) return;
  const rect = orbitStage.getBoundingClientRect();
  const mobile = rect.width < 760;
  const focusX = rect.width * (mobile ? .62 : .58);
  const focusY = rect.height * .5;
  const radiusX = rect.width * (mobile ? .17 : .2);
  const radiusY = rect.height * (mobile ? .76 : .72);
  const visibleArc = Math.max(.42, orbitStep * 3.7);
  let activeIndex = 0;
  let activeDistance = Infinity;

  orbitPieces.forEach((piece, index) => {
    const delta = normalizeAngle(index * orbitStep + currentAngle);
    const distance = Math.abs(delta);
    const visible = distance <= visibleArc * 1.12;
    if (!visible) {
      piece.style.opacity = "0";
      piece.style.pointerEvents = "none";
      piece.setAttribute("aria-hidden", "true");
      piece.classList.remove("is-active");
      return;
    }

    const t = clamp(delta / visibleArc, -1, 1);
    const phase = t * Math.PI * .5;
    const arcSin = Math.sin(phase);
    const arcCos = Math.max(0, Math.cos(phase));
    const x = focusX + arcSin * radiusX + (1 - arcCos) * rect.width * .055;
    const y = focusY + arcSin * radiusY;
    const depth = Math.pow(arcCos, 1.35);
    const scale = .36 + depth * .78;
    const opacity = .2 + Math.pow(arcCos, .7) * .8;
    const zIndex = 100 + Math.round(depth * 900);

    piece.style.opacity = opacity.toFixed(3);
    piece.style.zIndex = String(zIndex);
    piece.style.pointerEvents = distance < visibleArc * .94 ? "auto" : "none";
    piece.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) translate(-50%,-50%) scale(" + scale.toFixed(4) + ")";
    piece.setAttribute("aria-hidden", distance < visibleArc * .94 ? "false" : "true");

    const caption = piece.querySelector(".piece-caption");
    if (caption) {
      const captionScale = Math.min(1.58, 1 / Math.max(scale, .54));
      caption.style.transform = "scale(" + captionScale.toFixed(4) + ")";
      caption.style.transformOrigin = "center top";
    }

    if (distance < activeDistance) {
      activeDistance = distance;
      activeIndex = index;
    }
  });

  orbitPieces.forEach((piece, index) => piece.classList.toggle("is-active", index === activeIndex));
  orbitCurrent.textContent = String(activeIndex + 1).padStart(2, "0");
  const progress = orbitCount > 1 ? (activeIndex / (orbitCount - 1)) * 100 : 0;
  orbitHudLine.style.setProperty("--orbit-progress", progress.toFixed(2) + "%");
}

function animateOrbit() {
  const distance = targetAngle - currentAngle;
  currentAngle = reduceMotion ? targetAngle : currentAngle + distance * .115;
  if (Math.abs(distance) < .00001) currentAngle = targetAngle;
  renderOrbit();
  window.requestAnimationFrame(animateOrbit);
}

function moveOrbit(delta) {
  targetAngle += delta;
  scheduleSnap();
}

orbitStage?.addEventListener("wheel", (event) => {
  event.preventDefault();
  const wheelDelta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
  moveOrbit(-wheelDelta * .00105);
}, { passive: false });

orbitStage?.addEventListener("pointerdown", (event) => {
  dragging = true;
  pointerStartY = event.clientY;
  pointerStartAngle = targetAngle;
  orbitStage.classList.add("is-dragging");
  orbitStage.setPointerCapture(event.pointerId);
});

orbitStage?.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  targetAngle = pointerStartAngle - (event.clientY - pointerStartY) * .0038;
});

function stopDragging(event) {
  if (!dragging) return;
  dragging = false;
  orbitStage.classList.remove("is-dragging");
  if (event?.pointerId !== undefined && orbitStage.hasPointerCapture(event.pointerId)) {
    orbitStage.releasePointerCapture(event.pointerId);
  }
  scheduleSnap();
}

orbitStage?.addEventListener("pointerup", stopDragging);
orbitStage?.addEventListener("pointercancel", stopDragging);

orbitStage?.addEventListener("keydown", (event) => {
  if (["ArrowDown", "ArrowRight", "PageDown"].includes(event.key)) {
    event.preventDefault();
    targetAngle -= orbitStep;
    scheduleSnap();
  }
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(event.key)) {
    event.preventDefault();
    targetAngle += orbitStep;
    scheduleSnap();
  }
});

orbitPieces.forEach((piece, index) => {
  piece.addEventListener("dragstart", (event) => event.preventDefault());
  piece.querySelector("a")?.addEventListener("click", (event) => {
    const delta = normalizeAngle(index * orbitStep + targetAngle);
    if (Math.abs(delta) > orbitStep * .45) {
      event.preventDefault();
      targetAngle -= delta;
      scheduleSnap();
    }
  });
});

window.addEventListener("resize", renderOrbit);
window.__artOrbit = {
  getState: () => ({ currentAngle, targetAngle, activeIndex: nearestIndex(currentAngle), count: orbitCount }),
  rotateTo: (index) => {
    if (!orbitCount) return;
    const normalizedIndex = ((Number(index) % orbitCount) + orbitCount) % orbitCount;
    targetAngle = -normalizedIndex * orbitStep;
    scheduleSnap();
  },
};

renderOrbit();
window.requestAnimationFrame(animateOrbit);
}
</script>
<script>
(() => {
  let initialized = false;
  const loadScript = (source) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = source;
    script.onload = resolve;
    script.onerror = reject;
    document.body.append(script);
  });
  window.addEventListener("message", async (event) => {
    const payload = event.data;
    if (initialized || !payload || payload.type !== "creatx-art-atlas-data" || !Array.isArray(payload.items) || !payload.items.length) return;
    initialized = true;
    window.ART_ATLAS_LIBRARY_NAMES = payload.libraries;
    window.ART_ATLAS_ORBIT_ITEMS = payload.items;
    document.getElementById("orbitTotal").textContent = String(payload.items.length);
    document.addEventListener("click", (clickEvent) => {
      const target = clickEvent.target instanceof Element ? clickEvent.target : null;
      const approval = target?.closest('[aria-label="进入审批"]');
      const exhibition = target?.closest('[aria-label="进入展览"]');
      const chat = target?.closest('.chat-reveal');
      const piece = target?.closest('.piece-image')?.closest('[data-item-index]');
      if (!approval && !exhibition && !chat && !piece) return;
      clickEvent.preventDefault();
      clickEvent.stopImmediatePropagation();
      if (approval) parent.postMessage({ type: "creatx-art-atlas-route", route: "approval" }, "*");
      if (exhibition) parent.postMessage({ type: "creatx-art-atlas-route", route: "exhibition" }, "*");
      if (chat) parent.postMessage({ type: "creatx-art-atlas-chat" }, "*");
      if (piece) parent.postMessage({ type: "creatx-art-atlas-select", itemId: payload.items[Number(piece.dataset.itemIndex)]?.id }, "*");
    }, true);
    await loadScript("./art-atlas-orbit.js?v=20260805-orbit-intro-8");
    let pendingPiece;
    document.addEventListener('pointerdown', (event) => {
      const piece = event.target instanceof Element ? event.target.closest('.piece-image')?.closest('[data-item-index]') : null;
      pendingPiece = piece ? { x: event.clientX, y: event.clientY, itemId: payload.items[Number(piece.dataset.itemIndex)]?.id } : undefined;
    }, true);
    document.addEventListener('pointerup', (event) => {
      if (!pendingPiece || Math.hypot(event.clientX - pendingPiece.x, event.clientY - pendingPiece.y) > 6) return;
      parent.postMessage({ type: "creatx-art-atlas-select", itemId: pendingPiece.itemId }, "*");
      pendingPiece = undefined;
    }, true);
    document.querySelectorAll('.piece-image').forEach((link) => {
      link.removeAttribute('data-route-mist');
      link.setAttribute('href', '#');
      let pointerStart;
      link.addEventListener('pointerdown', (event) => { pointerStart = { x: event.clientX, y: event.clientY }; }, true);
      link.addEventListener('pointerup', (event) => {
        if (!pointerStart || Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 6) return;
        const piece = link.closest('[data-item-index]');
        parent.postMessage({ type: "creatx-art-atlas-select", itemId: payload.items[Number(piece?.dataset.itemIndex)]?.id }, "*");
      }, true);
      link.onclick = (clickEvent) => {
        clickEvent.preventDefault();
        clickEvent.stopPropagation();
        const piece = link.closest('[data-item-index]');
        parent.postMessage({ type: "creatx-art-atlas-select", itemId: payload.items[Number(piece?.dataset.itemIndex)]?.id }, "*");
      };
    });
    await loadScript("./art-atlas-intro.js?v=20260805-opening-14");
  });
  parent.postMessage({ type: "creatx-art-atlas-ready" }, "*");
})();
</script>
</body>
